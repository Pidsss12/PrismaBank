<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin - Prisma Bank{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#fbfcfe] text-slate-900">
    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-72 bg-slate-900 text-white flex flex-col sticky top-0 h-screen">
            <div class="p-8">
                <div class="flex items-center gap-3 mb-10">
                    <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white">
                        <i data-lucide="globe" class="w-4 h-4"></i>
                    </div>
                    <span class="font-black tracking-tighter uppercase text-sm">Prisma<span class="text-indigo-400">Bank</span> Admin</span>
                </div>

                <nav class="space-y-2">
                    <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4 pl-4">Main Menu</p>
                    <a href="{% url 'admin_dashboard' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-indigo-600 text-white font-bold transition-all">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
                    </a>
                    <a href="{% url 'monitor' %}" target="_blank" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-white/5 hover:text-white font-bold transition-all">
                        <i data-lucide="tv" class="w-4 h-4"></i> Monitor TV
                    </a>
                    <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-white/5 hover:text-white font-bold transition-all">
                        <i data-lucide="users" class="w-4 h-4"></i> Management
                    </a>
                    <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-white/5 hover:text-white font-bold transition-all">
                        <i data-lucide="settings" class="w-4 h-4"></i> Settings
                    </a>
                </nav>
            </div>

            <div class="mt-auto p-8 border-t border-white/5">
                <div class="flex items-center gap-4 mb-6">
                    <img src="https://i.pravatar.cc/100?u=admin" class="w-10 h-10 rounded-full border-2 border-indigo-600/30" alt="">
                    <div>
                        <p class="text-sm font-bold">{{ user.username }}</p>
                        <p class="text-[10px] text-slate-500 font-black uppercase">Super Admin</p>
                    </div>
                </div>
                <form action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button type="submit" class="w-full flex items-center justify-center gap-2 py-3 bg-white/5 rounded-xl text-slate-400 hover:text-red-400 hover:bg-red-500/10 transition-all font-bold text-xs uppercase tracking-widest">
                        <i data-lucide="log-out" class="w-3 h-3"></i> Log Out
                    </button>
                </form>
            </div>
        </aside>

        <!-- Content Area -->
        <main class="flex-1 p-12 overflow-y-auto">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
